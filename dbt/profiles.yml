# Cách dbt kết nối tới PostgreSQL. Không chứa mật khẩu: mọi giá trị đọc từ biến môi trường.
# Trên máy bạn: POSTGRES_HOST=localhost (từ .env). Trong Airflow: POSTGRES_HOST=postgres (do docker-compose đặt).
rentalpulse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics
      threads: 2