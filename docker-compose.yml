# ============================================================
# KHỐI DÙNG CHUNG CHO AIRFLOW (tái sử dụng bằng <<: *airflow-common)
# ============================================================
x-airflow-common: &airflow-common
  build: ./airflow   # dựng image riêng từ airflow/Dockerfile (có dbt và thư viện của dự án)
  image: rentalpulse-airflow:2.10.5
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "rentalpulse-dev-secret"
    PYTHONPATH: /opt/airflow/project
    # Trong Docker, dịch vụ gọi nhau bằng tên dịch vụ, không dùng localhost như trên máy host.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    RUSTFS_ENDPOINT: rustfs:9000
    RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
    RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    RUSTFS_BUCKET: ${RUSTFS_BUCKET}
    KAFKA_BOOTSTRAP: kafka:9092
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./dbt:/opt/airflow/dbt
    # Mã nguồn dự án, chỉ đọc. Không mount .env, .venv hay data/.
    - ./etl:/opt/airflow/project/etl:ro
    - ./collectors:/opt/airflow/project/collectors:ro
    - ./storage:/opt/airflow/project/storage:ro
    - ./sql:/opt/airflow/project/sql:ro
  depends_on:
    airflow-db:
      condition: service_healthy

services:

  # ---------- 1. POSTGRESQL: kho dữ liệu đã xử lý ----------
  postgres:
    image: postgres:16
    container_name: rental-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # ---------- 2. RUSTFS: kho dữ liệu thô (Bronze), tương thích S3 ----------
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: rental-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # cổng API (Python dùng)
      - "9001:9001"   # cổng giao diện web
    volumes:
      - rustfs_data:/data

  # ---------- 3. KAFKA: hệ thống truyền sự kiện ----------
  kafka:
    image: apache/kafka:3.9.0
    container_name: rental-kafka
    ports:
      - "29092:29092"   # cổng cho Python trên máy bạn
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---------- 4. KAFKA UI: giao diện xem Kafka ----------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rental-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # ---------- 5. AIRFLOW ----------
  airflow-db:
    image: postgres:16
    container_name: rental-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: rental-airflow-init
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    container_name: rental-airflow-web
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: rental-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pg_data:
  rustfs_data:
  kafka_data:
  airflow_db_data: